[package]
name = "nai-gallery"
version = "0.2.0"
description = "Local gallery for NovelAI-generated images"
authors = ["you"]
edition = "2021"

[lib]
name = "nai_gallery_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
# webp included because "png" files saved from browsers/Discord are sometimes
# really webp; the viewer webview renders them but the thumbnailer must decode them
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "rayon"] }
walkdir = "2"
notify = "8"
notify-debouncer-mini = "0.6"
rayon = "1"
regex = "1"
trash = "5"

[profile.dev]
# image decoding is unusably slow at opt-level 0
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
